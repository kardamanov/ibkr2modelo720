[project]
name = "ibkr2modelo720"
version = "0.1.0"
description = "IBKR CSV to Modelo 720 (AEAT) file generator with TUI"
readme = "README.md"
authors = [
    { name = "Konstantin Kardamanov", email = "uncle.korum@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "textual>=8.1.1",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
